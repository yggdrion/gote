name: 📦 Build - Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: read
      pull-requests: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_build: ${{ steps.check_commit.outputs.should_build }}
    steps:
      - name: Checkout code 🌿
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install semantic-release and plugins 📦
        run: |
          npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github conventional-changelog-conventionalcommits@9 semantic-release-export-data

      - name: Get next version from semantic-release 🏷️
        id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run || true
          VERSION=$(npx semantic-release --dry-run 2>&1 | grep -oP 'Skip v\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "Detected version: $VERSION"
          if [ -z "$VERSION" ]; then
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Abort if not latest commit on main ❌
        id: check_commit
        run: |
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "Current SHA: $GITHUB_SHA"
          echo "Remote SHA:  $REMOTE_SHA"
          if [ "$GITHUB_SHA" != "$REMOTE_SHA" ]; then
            echo "This workflow is not running on the latest commit of main. Exiting early."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # Build Tauri applications for multiple platforms
  build:
    needs: setup
    if: needs.setup.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            arch: amd64
            binary_name: gote.exe
            artifact_name: gote-windows-amd64.exe
          # macOS builds
          - os: macos-latest
            arch: amd64
            rust_target: x86_64-apple-darwin
            binary_name: gote
            artifact_name: gote-macos-amd64.app
          - os: macos-latest
            arch: arm64
            rust_target: aarch64-apple-darwin
            binary_name: gote
            artifact_name: gote-macos-arm64.app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code 🌿
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun 🍞
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust 🦀
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.rust_target }}
          cache-workspaces: src-tauri
          rustflags: ""

      - name: Install frontend dependencies 📦
        run: bun install --cwd frontend

      - name: Build Tauri app 🔨
        shell: bash
        env:
          # Signs the updater artifacts (.app.tar.gz / -setup.exe); the public
          # key is plugins.updater.pubkey in src-tauri/tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          # The release version from semantic-release; the updater compares it
          # with latest.json, so the build must carry it
          CONFIG="{\"version\":\"$VERSION\"}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            frontend/node_modules/.bin/tauri build --config "$CONFIG" --bundles nsis
          else
            frontend/node_modules/.bin/tauri build --config "$CONFIG" --target ${{ matrix.rust_target }} --bundles app,dmg
          fi

      - name: Stage release assets 📦
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            NSIS=src-tauri/target/release/bundle/nsis
            cp src-tauri/target/release/gote.exe dist/gote-windows-amd64.exe
            cp "$NSIS"/*-setup.exe dist/gote-windows-amd64-setup.exe
            cp "$NSIS"/*-setup.exe.sig dist/gote-windows-amd64-setup.exe.sig
          else
            B=src-tauri/target/${{ matrix.rust_target }}/release/bundle
            A=${{ matrix.arch }}
            (cd "$B/macos" && zip -qry "$GITHUB_WORKSPACE/dist/gote-macos-$A.app.zip" gote.app)
            cp "$B/macos/gote.app.tar.gz" "dist/gote-macos-$A.app.tar.gz"
            cp "$B/macos/gote.app.tar.gz.sig" "dist/gote-macos-$A.app.tar.gz.sig"
            cp "$B"/dmg/*.dmg "dist/gote-macos-$A.dmg"
          fi
          ls -la dist

      - name: Upload build artifacts 📤
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: error

  # Release job
  release:
    needs: [setup, build]
    if: needs.setup.outputs.should_build == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout code 🌿
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install semantic-release and plugins 📦
        run: |
          npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github conventional-changelog-conventionalcommits@9 semantic-release-export-data

      - name: Download build artifacts 📥
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts

      - name: Prepare release assets 📦
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;

          # Updater manifest. The app fetches it from
          # releases/latest/download/latest.json and verifies each signature
          cd release-assets
          BASE="https://github.com/yggdrion/gote/releases/download/v${VERSION}"
          for f in gote-macos-amd64.app.tar.gz gote-macos-arm64.app.tar.gz gote-windows-amd64-setup.exe; do
            test -f "$f" && test -f "$f.sig" || { echo "missing $f or its signature"; exit 1; }
          done
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "$BASE" \
            --rawfile mac_x64 gote-macos-amd64.app.tar.gz.sig \
            --rawfile mac_arm gote-macos-arm64.app.tar.gz.sig \
            --rawfile win gote-windows-amd64-setup.exe.sig \
            '{
              version: $version,
              notes: "See the release notes on GitHub.",
              pub_date: $pub_date,
              platforms: {
                "darwin-x86_64":  { signature: $mac_x64, url: "\($base)/gote-macos-amd64.app.tar.gz" },
                "darwin-aarch64": { signature: $mac_arm, url: "\($base)/gote-macos-arm64.app.tar.gz" },
                "windows-x86_64": { signature: $win,     url: "\($base)/gote-windows-amd64-setup.exe" }
              }
            }' > latest.json
          rm -f ./*.sig
          cat latest.json
          ls -la

      - name: Run semantic-release 🚀
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Pre-release check ==="
          ls -la release-assets/
          echo "=== Files to be uploaded ==="
          for file in release-assets/*; do
            if [ -f "$file" ]; then
              echo "File: $file ($(stat -c%s "$file") bytes)"
            fi
          done
          echo "=== Running semantic-release ==="
          semantic-release --debug

      - name: Update Homebrew Tap 🍺
        if: steps.release.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Get the released version
          VERSION="${{ needs.setup.outputs.version }}"
          echo "Updating Homebrew tap for version $VERSION"

          # Clone the homebrew tap repository using the fine-grained token
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/yggdrion/homebrew-tap.git tap-repo
          cd tap-repo

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Wait a moment for the release assets to be fully available
          echo "Waiting for release assets to be available..."
          sleep 30

          # Calculate SHA256 checksums for the release assets with retry logic
          for i in {1..5}; do
            echo "Attempt $i to download and calculate checksums..."
            AMD64_SHA=$(curl -sL "https://github.com/yggdrion/gote/releases/download/v${VERSION}/gote-macos-amd64.app.zip" | shasum -a 256 | cut -d' ' -f1)
            ARM64_SHA=$(curl -sL "https://github.com/yggdrion/gote/releases/download/v${VERSION}/gote-macos-arm64.app.zip" | shasum -a 256 | cut -d' ' -f1)
            
            if [[ -n "$AMD64_SHA" && -n "$ARM64_SHA" && "$AMD64_SHA" != "da39a3ee5e6b4b0d3255bfef95601890afd80709" && "$ARM64_SHA" != "da39a3ee5e6b4b0d3255bfef95601890afd80709" ]]; then
              echo "Successfully calculated checksums:"
              echo "AMD64: $AMD64_SHA"
              echo "ARM64: $ARM64_SHA"
              break
            else
              echo "Failed to get valid checksums, retrying in 10 seconds..."
              sleep 10
            fi
            
            if [[ $i -eq 5 ]]; then
              echo "Failed to get checksums after 5 attempts"
              exit 1
            fi
          done

          # Update the cask formula
          cat > Casks/gote.rb << EOF
          cask "gote" do
            version "${VERSION}"
            
            on_intel do
              url "https://github.com/yggdrion/gote/releases/download/v#{version}/gote-macos-amd64.app.zip"
              sha256 "${AMD64_SHA}"
            end
            
            on_arm do
              url "https://github.com/yggdrion/gote/releases/download/v#{version}/gote-macos-arm64.app.zip"
              sha256 "${ARM64_SHA}"
            end
            
            name "Gote"
            desc "Secure note-taking application built with Tauri"
            homepage "https://github.com/yggdrion/gote"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true

            app "gote.app"

            zap trash: [
              "~/Library/Application Support/gote",
              "~/Library/Caches/gote",
              "~/Library/Logs/gote",
              "~/Library/Preferences/com.gote.plist",
              "~/Library/Saved Application State/com.gote.savedState",
            ]
          end
          EOF

          # Commit and push the changes
          git add Casks/gote.rb
          git commit -m "chore: update gote to v${VERSION}

          - Updated from automated release workflow
          - AMD64 SHA256: ${AMD64_SHA}
          - ARM64 SHA256: ${ARM64_SHA}"
          git push
