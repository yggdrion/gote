name: 🦀 Rust - Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code 🌿
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies 📦
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Set up Bun 🍞
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust 🦀
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy, rustfmt
          cache-workspaces: src-tauri

      - name: Install frontend dependencies 📦
        run: bun install --cwd frontend

      - name: Build frontend 🔨
        run: bun run --cwd frontend build

      - name: Check formatting 🎨
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint with clippy 🔍
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests 🧪
        working-directory: src-tauri
        run: cargo test
